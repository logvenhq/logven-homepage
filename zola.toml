base_url = "https://logven.com"
title = "Logven"
description = "Logven is the programmable model of your company. Teams model and automate their processes with language, vision, time-series and decision models running on your own hardware, and Logven connects them into one model you can query and change like software."
default_language = "en"

# Sass compiles to the single /css/style.css asset.
compile_sass = true
build_search_index = false
generate_sitemap = true
generate_robots_txt = true
minify_html = true

[markdown]
smart_punctuation = true

[extra]
tagline = "The programmable model of your company"

# Logo showcase ("Developed in collaboration with"). Hidden for now; set to true to show it again.
show_partners = false

# Partners in the logo showcase. Add `logo = "brand/logos/<file>.svg"` to replace a text wordmark with an image.
# Five or more partners turn the strip into a scrolling marquee.
partners = [
  { name = "SKS Energies" },
  { name = "ARPAT" },
]
