base_url = "https://logven.com"
title = "Logven"
description = "Logven is an adaptive system for teams to model their processes and automate them, on small private models running on your own hardware. It builds an operating model of your company and keeps it as the system of record."
default_language = "en"

# Assets are maintained as plain CSS and static files.
compile_sass = false
build_search_index = false
generate_sitemap = true
generate_robots_txt = true
minify_html = true

[markdown]
smart_punctuation = true

[extra]
tagline = "The operating model of your company"

# Logo showcase ("Developed in collaboration with"). Hidden for now; set to true to show it again.
show_partners = false

# Partners in the logo showcase. Add `logo = "brand/logos/<file>.svg"` to replace a text wordmark with an image.
# Five or more partners turn the strip into a scrolling marquee.
partners = [
  { name = "SKS Energies" },
  { name = "ARPAT" },
]
